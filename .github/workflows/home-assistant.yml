name: Home Assistant

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-assistant-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect configuration changes
    runs-on: ubuntu-latest
    outputs:
      configuration: ${{ steps.detect.outputs.configuration }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "configuration=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            configuration ci tools Makefile .ha-image .ha-version .yamllint \
            .github/workflows/home-assistant.yml .github/workflows/deploy.yml; then
            echo "configuration=false" >> "$GITHUB_OUTPUT"
          else
            echo "configuration=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint YAML
    needs: changes
    if: needs.changes.outputs.configuration == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Lint YAML
        run: ./tools/lint

  check:
    name: Check Home Assistant config
    needs: changes
    if: needs.changes.outputs.configuration == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate staged configuration
        run: ./tools/check-config

      - name: Test scoped deployment and rollback
        run: ./tools/test-deploy

      - name: Upload validated configuration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: home-assistant-config-${{ github.sha }}
          path: |
            dist/config
            dist/manifest.sha256
            dist/REVISION
          if-no-files-found: error
          retention-days: 30

  required:
    name: Validate configuration
    if: always()
    needs:
      - changes
      - lint
      - check
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            exit 1
          fi

          if [ "$LINT_RESULT" = "failure" ] || [ "$LINT_RESULT" = "cancelled" ]; then
            exit 1
          fi

          if [ "$CHECK_RESULT" = "failure" ] || [ "$CHECK_RESULT" = "cancelled" ]; then
            exit 1
          fi
