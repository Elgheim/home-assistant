# Main Home Assistant configuration.
#
# Files under this directory are the repository-managed configuration payload.
# Home Assistant's UI-managed automations, scripts, and scenes stay in their
# conventional root files and are preserved by deployment.

homeassistant:
  name: Home
  latitude: !secret home_latitude
  longitude: !secret home_longitude
  elevation: !secret home_elevation
  unit_system: metric
  time_zone: !secret time_zone
  packages: !include_dir_named packages/

# Keep UI/API-managed entries separate from repository-managed entries.
automation ui: !include automations.yaml
automation repo: !include_dir_merge_list automations/
script ui: !include scripts.yaml
script repo: !include_dir_merge_named scripts/
scene ui: !include scenes.yaml
scene repo: !include_dir_merge_list scenes/

input_select: !include input_select.yaml

frontend:
  themes: !include_dir_merge_named themes/

http:
  server_port: 8123

mobile_app:

person:

zone:

sun:
